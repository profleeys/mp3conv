<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 MP3 音訊轉換與區間擷取工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #222f4c;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --input-bg: #1c273e;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 8px;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #c084fc;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
      text-align: center;
      user-select: none;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .tab:hover:not(.active) {
      border-color: #3b82f6;
      color: var(--text);
    }

    /* ── Drop Zone ── */
    .drop-zone {
      border: 2px dashed var(--card-border);
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      background: rgba(28, 39, 62, 0.4);
      transition: all 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.08);
    }
    .drop-zone .icon {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }
    .drop-zone p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .drop-zone strong {
      color: #a5b4fc;
    }
    #fileInput { display: none; }

    /* ── URL Input ── */
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-field {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .input-field:focus {
      border-color: var(--accent);
    }
    .input-field::placeholder {
      color: #64748b;
    }

    /* ── Buttons ── */
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-secondary {
      background: #273553;
      color: #cbd5e1;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .btn-secondary:hover {
      background: #334469;
      color: #fff;
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      width: 100%;
      font-size: 1.05rem;
      padding: 15px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .btn-success:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-success:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* ── Media Info Card ── */
    .media-info {
      display: none;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      gap: 14px;
      align-items: center;
    }
    .media-info.visible { display: flex; }
    .media-info img {
      width: 90px;
      height: 54px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .media-meta { flex: 1; min-width: 0; }
    .media-meta .name {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .media-meta .dur {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ── Audio Player Preview ── */
    .audio-player-wrap {
      display: none;
      margin-top: 14px;
      width: 100%;
    }
    .audio-player-wrap.visible { display: block; }
    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      outline: none;
    }

    /* ── YouTube Embed Preview ── */
    .yt-embed-wrap {
      display: none;
      margin-top: 14px;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      width: 100%;
      border: 1px solid var(--card-border);
    }
    .yt-embed-wrap.visible { display: block; }
    .yt-embed-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── Trimming Toggle & Inputs ── */
    .range-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }
    .range-toggle input[type="checkbox"] { display: none; }
    .toggle-pill {
      width: 44px;
      height: 24px;
      background: var(--card-border);
      border-radius: 12px;
      position: relative;
      transition: background 0.25s;
    }
    .toggle-pill::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s;
    }
    input[type="checkbox"]:checked + .toggle-pill {
      background: var(--accent);
    }
    input[type="checkbox"]:checked + .toggle-pill::after {
      transform: translateX(20px);
    }
    .range-toggle-label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .range-inputs {
      display: none;
      margin-top: 16px;
      gap: 14px;
    }
    .range-inputs.visible { display: flex; flex-direction: column; }
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .time-input-wrap label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .quick-set-btns {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    /* ── Timeline Visualizer ── */
    .timeline-wrap {
      display: none;
      margin-top: 16px;
    }
    .timeline-wrap.visible { display: block; }
    .timeline-bar-outer {
      height: 48px;
      background: var(--input-bg);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      border: 1px solid var(--card-border);
      overflow: hidden;
      user-select: none;
    }
    .timeline-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 6px 10px;
    }
    .wave-bar {
      flex: 1;
      background: #25334d;
      border-radius: 2px;
      min-height: 4px;
    }
    .timeline-selection {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(99, 102, 241, 0.35);
      border-left: 3px solid #818cf8;
      border-right: 3px solid #818cf8;
      pointer-events: none;
    }
    .timeline-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    /* ── Status & Feedback ── */
    .status-box {
      display: none;
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      align-items: center;
      gap: 12px;
      word-break: break-word;
    }
    .status-box.visible { display: flex; }
    .status-box.loading {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid #6366f1;
      color: #a5b4fc;
    }
    .status-box.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .status-box.success-msg {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(165,180,252,0.3);
      border-top-color: #a5b4fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      margin-top: 40px;
      color: #64748b;
      font-size: 0.82rem;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎵 MP3 轉換與區間擷取</h1>
    <p>上傳影音檔案或輸入 YouTube 連結，擷取自訂區間並快速下載 MP3</p>
  </header>

  <!-- ── 來源卡片 ── -->
  <div class="card">
    <div class="card-title">1. 選擇音訊來源</div>

    <div class="tabs">
      <div class="tab active" id="tabFile" onclick="switchTab('file')">📂 本地上傳</div>
      <div class="tab" id="tabYt" onclick="switchTab('youtube')">▶️ YouTube 連結</div>
    </div>

    <!-- 本地上傳區 -->
    <div id="panelFile">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()"
           ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <div class="icon">📁</div>
        <p><strong>點擊選擇</strong> 或將影音檔案拖曳至此</p>
        <p style="margin-top:6px;font-size:0.8rem;">支援 MP4, MP3, WAV, M4A, FLAC, MKV, MOV, WEBM 等 (上限 500 MB)</p>
      </div>
      <input type="file" id="fileInput" accept="audio/*,video/*" onchange="handleFileSelect(this)"/>

      <div class="media-info" id="fileInfo">
        <div class="media-meta">
          <div class="name" id="fileName">-</div>
          <div class="dur" id="fileDur">-</div>
        </div>
      </div>

      <!-- 本地音訊即時試聽 -->
      <div class="audio-player-wrap" id="audioPreviewWrap">
        <audio id="audioPreview" controls preload="metadata"></audio>
      </div>
    </div>

    <!-- YouTube 輸入區 -->
    <div id="panelYt" style="display:none;">
      <div class="input-row">
        <input class="input-field" type="url" id="ytUrl" placeholder="請貼上 YouTube 網址 (如 https://www.youtube.com/watch?v=...)" />
        <button class="btn btn-primary" id="btnYtFetch" onclick="fetchYtInfo()">取得資訊</button>
      </div>

      <div class="media-info" id="ytInfo">
        <img id="ytThumb" src="" alt="縮圖" />
        <div class="media-meta">
          <div class="name" id="ytTitle">-</div>
          <div class="dur" id="ytDur">-</div>
        </div>
      </div>

      <!-- YouTube 嵌入試聽預覽 -->
      <div class="yt-embed-wrap" id="ytEmbedWrap">
        <iframe id="ytIframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>

      <div class="status-box" id="ytStatus"></div>
    </div>
  </div>

  <!-- ── 區間擷取卡片 ── -->
  <div class="card">
    <div class="card-title">2. 擷取區間設定 (可選)</div>

    <label class="range-toggle">
      <input type="checkbox" id="trimToggle" onchange="toggleTrim(this)"/>
      <div class="toggle-pill"></div>
      <span class="range-toggle-label">啟用自訂時間區間剪輯</span>
    </label>

    <div class="range-inputs" id="rangeInputs">
      <div class="time-grid">
        <div class="time-input-wrap">
          <label>開始時間 (分:秒 或 時:分:秒)</label>
          <input class="input-field" type="text" id="startTime" placeholder="00:00" oninput="syncTimeline()"/>
          <div class="quick-set-btns" id="startQuickBtns" style="display:none;">
            <button class="btn btn-secondary" type="button" onclick="setPlayheadAsStart()">📍 當前播放位置為開始</button>
          </div>
        </div>
        <div class="time-input-wrap">
          <label>結束時間 (分:秒 或 時:分:秒)</label>
          <input class="input-field" type="text" id="endTime" placeholder="00:30" oninput="syncTimeline()"/>
          <div class="quick-set-btns" id="endQuickBtns" style="display:none;">
            <button class="btn btn-secondary" type="button" onclick="setPlayheadAsEnd()">📍 當前播放位置為結束</button>
          </div>
        </div>
      </div>

      <!-- 視覺化滑桿時間軸 -->
      <div class="timeline-wrap" id="timelineWrap">
        <div class="timeline-bar-outer" id="timelineBar"
             onmousedown="startDrag(event)" onmousemove="moveDrag(event)" onmouseup="endDrag(event)"
             onmouseleave="endDrag(event)">
          <div class="timeline-bg" id="timelineBg"></div>
          <div class="timeline-selection" id="timelineSel" style="left:0%;width:100%"></div>
        </div>
        <div class="timeline-hint">💡 可在時間軸上滑鼠點擊或拖曳選取區間，亦可直接輸入時間</div>
      </div>
    </div>
  </div>

  <!-- ── 轉換與下載卡片 ── -->
  <div class="card">
    <div class="card-title">3. 開始轉檔並下載</div>
    <button class="btn btn-success" id="convertBtn" onclick="startConvert()" disabled>
      ⬇️ 轉換並下載 MP3
    </button>
    <div class="status-box" id="convertStatus"></div>
  </div>

  <footer>
    支援高音質 MP3 (192kbps) 轉換 ｜ 伺服器暫存檔案於轉換後自動銷毀<br/>
    可無縫部署於 Render / Docker 容器環境
  </footer>
</div>

<script>
  let currentTab = 'file';
  let uploadedFileId = null;
  let mediaDuration = 0; // seconds
  let mediaTitle = '';

  // Timeline drag state
  let dragging = false;
  let dragStartPct = 0;
  let dragEndPct = 1;
  let whichHandle = null;

  const audioPreview = document.getElementById('audioPreview');

  // Format seconds to mm:ss or hh:mm:ss
  function formatTime(sec) {
    if (!sec && sec !== 0) return '00:00';
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  // Parse mm:ss or hh:mm:ss to seconds
  function parseTime(str) {
    if (!str) return null;
    const parts = str.trim().split(':').map(Number);
    if (parts.some(isNaN)) return null;
    if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
    if (parts.length === 2) return parts[0]*60 + parts[1];
    return parts[0];
  }

  function showStatus(elId, type, msg) {
    const el = document.getElementById(elId);
    el.className = 'status-box visible ' + type;
    if (type === 'loading') {
      el.innerHTML = `<div class="spinner"></div><span>${msg}</span>`;
    } else {
      const icons = { error: '❌', 'success-msg': '✅' };
      el.innerHTML = `<span>${icons[type] || ''}</span><span>${msg}</span>`;
    }
  }

  function hideStatus(elId) {
    document.getElementById(elId).className = 'status-box';
  }

  function setMediaReady(duration, title) {
    mediaDuration = duration;
    mediaTitle = title;
    buildTimeline();
    document.getElementById('convertBtn').disabled = false;

    if (document.getElementById('trimToggle').checked) {
      document.getElementById('endTime').placeholder = formatTime(duration);
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    uploadedFileId = null;
    mediaDuration = 0;
    mediaTitle = '';
    document.getElementById('convertBtn').disabled = true;

    document.getElementById('tabFile').className = 'tab' + (tab === 'file' ? ' active' : '');
    document.getElementById('tabYt').className = 'tab' + (tab === 'youtube' ? ' active' : '');
    document.getElementById('panelFile').style.display = tab === 'file' ? '' : 'none';
    document.getElementById('panelYt').style.display = tab === 'youtube' ? '' : 'none';
    document.getElementById('fileInfo').className = 'media-info';
    document.getElementById('ytInfo').className = 'media-info';
    document.getElementById('audioPreviewWrap').className = 'audio-player-wrap';
    document.getElementById('ytEmbedWrap').className = 'yt-embed-wrap';
    audioPreview.pause();
    document.getElementById('ytIframe').src = '';

    document.getElementById('startQuickBtns').style.display = 'none';
    document.getElementById('endQuickBtns').style.display = 'none';
    hideStatus('ytStatus');
    hideStatus('convertStatus');
  }

  // ── File Drag & Drop ────────────────────────────────────────────────────────
  function onDragOver(e) {
    e.preventDefault();
    document.getElementById('dropZone').classList.add('dragover');
  }
  function onDragLeave(e) {
    document.getElementById('dropZone').classList.remove('dragover');
  }
  function onDrop(e) {
    e.preventDefault();
    document.getElementById('dropZone').classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      uploadFile(e.dataTransfer.files[0]);
    }
  }
  function handleFileSelect(input) {
    if (input.files && input.files[0]) {
      uploadFile(input.files[0]);
    }
  }

  async function uploadFile(file) {
    const dz = document.getElementById('dropZone');
    dz.querySelector('p').textContent = `正在上傳 ${file.name}...`;
    document.getElementById('convertBtn').disabled = true;
    hideStatus('convertStatus');

    // Setup local audio preview immediately if supported
    try {
      const blobUrl = URL.createObjectURL(file);
      audioPreview.src = blobUrl;
      document.getElementById('audioPreviewWrap').className = 'audio-player-wrap visible';
      document.getElementById('startQuickBtns').style.display = 'flex';
      document.getElementById('endQuickBtns').style.display = 'flex';
    } catch (e) {}

    const form = new FormData();
    form.append('file', file);

    try {
      const r = await fetch('/api/upload', { method: 'POST', body: form });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error);

      uploadedFileId = data.fileId;
      document.getElementById('fileName').textContent = data.originalName;
      document.getElementById('fileDur').textContent = '檔案總時長：' + formatTime(data.duration);
      document.getElementById('fileInfo').className = 'media-info visible';
      dz.querySelector('p').innerHTML = '<strong>點擊更換</strong> 或拖曳其他檔案至此';

      const baseTitle = data.originalName.replace(/\.[^.]+$/, '');
      setMediaReady(data.duration, baseTitle);
    } catch (err) {
      dz.querySelector('p').innerHTML = '<strong>點擊選擇</strong> 或將影音檔案拖曳至此';
      alert('上傳分析失敗：' + err.message);
    }
  }

  // ── YouTube Info ────────────────────────────────────────────────────────────
  async function fetchYtInfo() {
    const url = document.getElementById('ytUrl').value.trim();
    if (!url) return alert('請輸入有效的 YouTube 網址');

    const btn = document.getElementById('btnYtFetch');
    btn.disabled = true;
    showStatus('ytStatus', 'loading', '正在解析 YouTube 影片資訊...');
    document.getElementById('ytInfo').className = 'media-info';
    document.getElementById('ytEmbedWrap').className = 'yt-embed-wrap';
    document.getElementById('convertBtn').disabled = true;

    try {
      const r = await fetch('/api/youtube-info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error);

      document.getElementById('ytThumb').src = data.thumbnail || '';
      document.getElementById('ytTitle').textContent = data.title;
      document.getElementById('ytDur').textContent = '影片時長：' + formatTime(data.duration) + (data.uploader ? ` · ${data.uploader}` : '');
      document.getElementById('ytInfo').className = 'media-info visible';

      if (data.id) {
        document.getElementById('ytIframe').src = `https://www.youtube-nocookie.com/embed/${data.id}`;
        document.getElementById('ytEmbedWrap').className = 'yt-embed-wrap visible';
      }

      hideStatus('ytStatus');
      setMediaReady(data.duration, data.title);
    } catch (err) {
      showStatus('ytStatus', 'error', err.message);
    } finally {
      btn.disabled = false;
    }
  }

  // ── Trim & Timeline ─────────────────────────────────────────────────────────
  function toggleTrim(cb) {
    const ri = document.getElementById('rangeInputs');
    const tw = document.getElementById('timelineWrap');
    if (cb.checked) {
      ri.className = 'range-inputs visible';
      if (mediaDuration > 0) {
        tw.className = 'timeline-wrap visible';
        document.getElementById('startTime').value = '00:00';
        document.getElementById('endTime').value = formatTime(mediaDuration);
        dragStartPct = 0;
        dragEndPct = 1;
        updateSelectionBar();
      }
    } else {
      ri.className = 'range-inputs';
      tw.className = 'timeline-wrap';
    }
  }

  function setPlayheadAsStart() {
    if (audioPreview && !isNaN(audioPreview.currentTime)) {
      const cur = Math.floor(audioPreview.currentTime);
      document.getElementById('startTime').value = formatTime(cur);
      syncTimeline();
    }
  }

  function setPlayheadAsEnd() {
    if (audioPreview && !isNaN(audioPreview.currentTime)) {
      const cur = Math.ceil(audioPreview.currentTime);
      document.getElementById('endTime').value = formatTime(cur);
      syncTimeline();
    }
  }

  function buildTimeline() {
    const bg = document.getElementById('timelineBg');
    bg.innerHTML = '';
    const barsCount = 70;
    for (let i = 0; i < barsCount; i++) {
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      const h = 25 + Math.abs(Math.sin(i * 0.6) * 35 + Math.cos(i * 1.3) * 20);
      bar.style.height = `${Math.min(95, Math.round(h))}%`;
      bg.appendChild(bar);
    }
    if (document.getElementById('trimToggle').checked) {
      document.getElementById('timelineWrap').className = 'timeline-wrap visible';
    }
  }

  function updateSelectionBar() {
    const sel = document.getElementById('timelineSel');
    sel.style.left = (dragStartPct * 100).toFixed(2) + '%';
    sel.style.width = ((dragEndPct - dragStartPct) * 100).toFixed(2) + '%';
  }

  function startDrag(e) {
    if (mediaDuration <= 0) return;
    dragging = true;
    const rect = document.getElementById('timelineBar').getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

    const startDist = Math.abs(pct - dragStartPct);
    const endDist = Math.abs(pct - dragEndPct);
    if (startDist < 0.06) whichHandle = 'start';
    else if (endDist < 0.06) whichHandle = 'end';
    else {
      whichHandle = 'end';
      dragStartPct = pct;
      dragEndPct = pct;
    }
    updateFromDrag(e);
  }

  function moveDrag(e) {
    if (!dragging) return;
    updateFromDrag(e);
  }

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    updateFromDrag(e);
  }

  function updateFromDrag(e) {
    const rect = document.getElementById('timelineBar').getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

    if (whichHandle === 'start') {
      dragStartPct = Math.min(pct, dragEndPct - 0.01);
    } else {
      dragEndPct = Math.max(pct, dragStartPct + 0.01);
    }

    updateSelectionBar();
    document.getElementById('startTime').value = formatTime(Math.round(dragStartPct * mediaDuration));
    document.getElementById('endTime').value = formatTime(Math.round(dragEndPct * mediaDuration));
  }

  function syncTimeline() {
    if (mediaDuration <= 0) return;
    const s = parseTime(document.getElementById('startTime').value);
    const e = parseTime(document.getElementById('endTime').value);
    if (s != null) dragStartPct = Math.max(0, Math.min(1, s / mediaDuration));
    if (e != null) dragEndPct = Math.max(0, Math.min(1, e / mediaDuration));
    updateSelectionBar();
  }

  // ── Convert & Download ──────────────────────────────────────────────────────
  async function startConvert() {
    const btn = document.getElementById('convertBtn');
    btn.disabled = true;
    showStatus('convertStatus', 'loading', '正在轉換為 MP3，請稍候... (YouTube 影片下載與轉碼可能需要十數秒至數分鐘)');

    const trimEnabled = document.getElementById('trimToggle').checked;
    let startSec = null, endSec = null;
    if (trimEnabled) {
      startSec = parseTime(document.getElementById('startTime').value) ?? 0;
      endSec = parseTime(document.getElementById('endTime').value);
      if (endSec !== null && endSec <= startSec) {
        showStatus('convertStatus', 'error', '擷取結束時間必須大於開始時間！');
        btn.disabled = false;
        return;
      }
    }

    const payload = {
      type: currentTab,
      startSec: trimEnabled ? startSec : null,
      endSec: trimEnabled ? endSec : null,
      title: mediaTitle || 'output'
    };

    if (currentTab === 'file') {
      if (!uploadedFileId) {
        showStatus('convertStatus', 'error', '請先選擇並上傳檔案');
        btn.disabled = false;
        return;
      }
      payload.fileId = uploadedFileId;
    } else {
      const url = document.getElementById('ytUrl').value.trim();
      if (!url) {
        showStatus('convertStatus', 'error', '請輸入 YouTube 網址');
        btn.disabled = false;
        return;
      }
      payload.url = url;
    }

    try {
      const r = await fetch('/api/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!r.ok) {
        let errJson = {};
        try { errJson = await r.json(); } catch(e) {}
        throw new Error(errJson.error || `伺服器回應錯誤 (狀態碼 ${r.status})`);
      }

      // Download file stream
      const blob = await r.blob();
      const downloadUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');

      let downloadName = `${mediaTitle || 'audio'}.mp3`;
      const dispHeader = r.headers.get('Content-Disposition') || '';
      const match = dispHeader.match(/filename\*=UTF-8''(.+)/);
      if (match) {
        downloadName = decodeURIComponent(match[1]);
      }

      a.href = downloadUrl;
      a.download = downloadName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(downloadUrl);

      showStatus('convertStatus', 'success-msg', `下載已成功觸發！檔名：${downloadName}`);
    } catch (err) {
      showStatus('convertStatus', 'error', '轉檔失敗：' + err.message);
    } finally {
      btn.disabled = false;
    }
  }

  // Initial setup
  buildTimeline();
</script>
</body>
